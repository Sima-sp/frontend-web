# Build da página em todo pull request (a página não tem testes automáticos).
#
# A publicação no GitHub Pages continua no publicar.yml (só na main). Este job se chama "ci":
# é esse nome que a regra da branch main exige.

name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (com a mesma subpasta da publicação)
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /frontend-web
