# Publica a página do SIMA no GitHub Pages a cada envio para a branch main.
#
# O que faz: instala as dependências, gera o site estático (npm run build, pasta out/) e publica.
# O endereço fica em https://<organização>.github.io/<repositório>/. O próprio GitHub informa a
# subpasta (base_path), que o Next precisa conhecer para achar os arquivos da página.
#
# Para funcionar, o repositório precisa:
#   - ser público (no plano gratuito, o Pages só publica repositório público);
#   - estar com o Pages ligado em Settings → Pages → Source: "GitHub Actions" (uma vez só).

name: Publicar a página

on:
  push:
    branches: [main]
  workflow_dispatch: # permite publicar de novo pelo botão "Run workflow"

permissions:
  contents: read
  pages: write
  id-token: write

# Se dois envios chegarem juntos, vale o mais recente.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    name: Gerar a página
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  publicar:
    name: Publicar no GitHub Pages
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@v5
